name: Functions

on:
  push:
    branches: [master]
    paths:
      - "functions/**"
      - ".github/workflows/functions.yml"
  pull_request:
    branches: [master]
    paths:
      - "functions/**"
      - ".github/workflows/functions.yml"

jobs:
  functions:
    name: Functions
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
